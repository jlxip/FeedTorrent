[package]
name = "feedtorrent"
version.workspace = true
edition.workspace = true
[dependencies]
feedtorrent-posts = { path = "../posts" }
feedtorrent-pubsub-udp = { path = "../backends/pubsub-udp" }
feedtorrent-bep = { path = "../bep" }
feedtorrent-libtorrent = { path = "../backends/libtorrent" }
anyhow = "1.0"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
async-stream = "0.3"
getrandom = "0.3"
argon2 = { version = "=0.5.3", features = ["std", "zeroize"] }
chacha20poly1305 = "=0.10.1"
tar = "=0.4.46"
zeroize = "=1.9.1"
maxminddb = "=0.33.0"
libc = "=0.2.191"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.12"
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
semver = "=1.0.28"
sha2 = "=0.11.1"
http-body = "=1.0.1"
