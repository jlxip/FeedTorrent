[package]
name = "feedtorrent"
version.workspace = true
edition.workspace = true
[dependencies]
feedtorrent-posts = { path = "../posts" }
feedtorrent-pubsub-udp = { path = "../backends/pubsub-udp" }
feedtorrent-bep = { path = "../bep" }
feedtorrent-libtorrent = { path = "../backends/libtorrent" }
anyhow = "1.0"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
async-stream = "0.3"
getrandom = "0.3"
argon2 = { version = "=0.5.3", features = ["std", "zeroize"] }
chacha20poly1305 = "=0.10.1"
tar = "=0.4.46"
zeroize = "=1.9.1"
