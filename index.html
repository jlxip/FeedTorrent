  }
  if(kind==='direct'||kind==='link'){
   title=kind==='direct'?'Add torrent':'Link a torrent';body=`<form id="p2p-modal-form" class="form"><label>Name<input name="name" maxlength="120" placeholder="Content name" required autocomplete="off"></label><label>Magnet${kind==='direct'?' or .torrent filename':''}<textarea name="link" style="min-height:85px" placeholder="magnet:?xt=urn:btih:…" required></textarea></label>${btn(kind==='direct'?'Use a sample torrent':'Use a sample reference','sample-torrent','','quiet')}<p class="subtle">${kind==='direct'?'Added directly to Transfers, without following a feed.':'An independent reference. Linking does not download its content.'}</p><div class="error" role="alert"></div><div class="form-actions"><button class="btn primary cursor-interaction" type="button" data-action="submit-form">${kind==='direct'?'Add and download':'Link'}</button></div></form>`;
  }
  if(kind==='attachments'){
   title='Attach files';body=`<form id="p2p-modal-form" class="form"><p class="sheet-note">Sample files</p>${[file('photographs.zip',128),file('notes.pdf',2),file('short-film.mp4',640)].map((f,i)=>`<label class="check"><input type="checkbox" name="file${i}" value="${i}"><span>${esc(f.name)} · ${size(f.mb)}</span></label>`).join('')}<div class="error" role="alert"></div><div class="form-actions"><button class="btn primary cursor-interaction" type="button" data-action="submit-form">Attach</button></div></form>`;
  }
  $('#p2p-modal').innerHTML=`<div class="shade"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="p2p-sheet-title"><div class="row between" style="align-items:flex-start"><h2 id="p2p-sheet-title">${esc(title)}</h2>${btn('Close','close-modal','','quiet')}</div>${body}</section></div>`;
  $('.workspace').inert=true;$('.toolbar').inert=true;icons();
  const first=$('#p2p-modal input, #p2p-modal textarea, #p2p-modal button');first?.focus();
 }
 function closeModal(){modal=null;$('#p2p-modal').innerHTML='';$('.workspace').inert=false;$('.toolbar').inert=false;if(returnFocus?.isConnected)returnFocus.focus();}
 function modalSubmit(form){
  const data=new FormData(form),kind=modal.kind;
  if(kind==='settings'){const f=feed(modal.id);readDownloadOptions(form,f);if(f.mirror)mirrorFeed(f);closeModal();tell(f.mirror?'Mirroring all posts in this feed':'Feed settings saved');render();save();return;}
  if(kind==='own-feed'||kind==='follow'){
   const name=String(data.get('name')||'').trim(),link=String(data.get('link')||'').trim();
   if(!name||(kind==='follow'&&!link)){form.querySelector('.error').textContent='Enter the feed name and magnet.';return;}
   const f={id:`feed-${++state.serial}`,name,author:kind==='own-feed'?'You':name,own:kind==='own-feed',followed:true,auto:false,mirror:false,...(kind==='follow'?{address:link}:{})};if(kind==='follow')readDownloadOptions(form,f);state.feeds.push(f);
   if(!f.own)state.posts.push({id:`sample-${state.serial}`,feed:f.id,parent:null,title:'A first selection',stamp:++state.clock,read:false,loaded:false,versions:[version('I have put together this selection to share in the feed. Future collections will appear here.',[file('collection.pdf',24)])]});
   if(f.mirror)mirrorFeed(f);
   closeModal();navigate(`feed:${f.id}`);tell(f.own?'Feed created. You can write your first post.':f.mirror?'Feed followed. Mirroring all posts.':'Feed followed');save();return;
  }
  if(kind==='attachments'){
   const d=state.drafts[state.activeDraft],available=[file('photographs.zip',128),file('notes.pdf',2),file('short-film.mp4',640)];
   available.forEach((f,i)=>{if(data.has(`file${i}`)&&!d.files.some(old=>old.name===f.name))d.files.push(f);});closeModal();renderDetail();save();return;
  }
  if(kind==='direct'||kind==='link'){
   const name=String(data.get('name')||'').trim(),link=String(data.get('link')||'').trim();
   if(!name||!(/^(magnet:\?|.+\.torrent$)/i.test(link))){form.querySelector('.error').textContent='Enter a name and a magnet link or a filename ending in .torrent.';return;}
   if(kind==='link'){state.drafts[state.activeDraft].refs.push({title:name,target:`ref-${++state.serial}`,mb:320,link});closeModal();renderDetail();save();return;}
   const p={id:`direct-${++state.serial}`,feed:null,parent:null,title:name,stamp:++state.clock,read:true,loaded:true,versions:[version('Torrent added directly, without a feed.',[file(link.toLowerCase().endsWith('.torrent')?name:`${name}.zip`,320)])]};state.posts.push(p);enqueue(p);closeModal();navigate('transfers');state.mobile='reader';render();tell('Torrent added to Transfers');save();
  }
 }
 root.addEventListener('input',event=>{
  const el=event.target;if(!el.closest('#p2p-editor'))return;
  const d=state.drafts[state.activeDraft];if(d&&['title','body','feed'].includes(el.name)){d[el.name]=el.value;save();}
 });
 root.addEventListener('change',event=>{
  const el=event.target;
  if(el.closest('#p2p-modal-form')&&el.name==='mirror'){const auto=el.form.elements.auto;if(el.checked){auto.dataset.futureAuto=String(auto.checked);auto.checked=true;auto.disabled=true;}else{auto.disabled=false;auto.checked=auto.dataset.futureAuto==='true';}}
  if(el.closest('#p2p-editor')&&el.name==='feed'){state.drafts[state.activeDraft].feed=el.value;save();}
 });
 root.addEventListener('submit',event=>{
  if(event.target.id==='p2p-editor'){event.preventDefault();publish();}
  if(event.target.id==='p2p-modal-form'){event.preventDefault();modalSubmit(event.target);}
 });
 root.addEventListener('keydown',event=>{
  if(event.key==='Enter'&&event.target.tagName==='INPUT'&&event.target.form?.closest('#p2p-reader')){event.preventDefault();const form=event.target.form;if(form.reportValidity()){if(form.id==='p2p-editor')publish();else if(form.id==='p2p-modal-form')modalSubmit(form);}return;}
  if(event.key==='Escape'&&modal){event.preventDefault();closeModal();}
  if(event.key==='Tab'&&modal){const items=[...$('#p2p-modal').querySelectorAll('button,input,textarea,select')].filter(x=>!x.disabled);const first=items[0],last=items[items.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}
 });
 root.addEventListener('click',event=>{
  const el=event.target.closest('button[data-action]');if(!el||!root.contains(el)||el.disabled)return;
  const action=el.dataset.action,id=el.dataset.id;
  if(action==='submit-form'){const form=el.closest('form');if(!form||!form.reportValidity())return;if(form.id==='p2p-editor')publish();else if(form.id==='p2p-modal-form')modalSubmit(form);}
  else if(action==='nav')navigate(id);
  else if(action==='select-thread')selectThread(id);
  else if(action==='select-tx'){state.selection=id;state.activeDraft=null;state.mobile='reader';render();save();}
  else if(action==='follow')showModal('follow');
  else if(action==='own-feed')showModal('own-feed');
  else if(action==='direct')showModal('direct');
  else if(action==='close-modal')closeModal();
  else if(action==='feed-settings')showModal('settings',id);
  else if(action==='refresh')refresh();
  else if(action==='compose'){if(state.lastDraft&&state.drafts[state.lastDraft]){state.activeDraft=state.lastDraft;state.mobile='reader';render();}else compose('new',null,state.view.startsWith('feed:')&&feed(state.view.slice(5))?.own?state.view.slice(5):null);}
  else if(action==='compose-new')compose('new',null,id);
  else if(action==='reply')compose('reply',post(id));
  else if(action==='edit')compose('edit',post(id));
  else if(action==='close-editor'){state.activeDraft=null;render();save();}
  else if(action==='attachments')showModal('attachments');
  else if(action==='link-torrent')showModal('link');
  else if(action==='remove-file'||action==='remove-ref'){state.drafts[state.activeDraft][action==='remove-file'?'files':'refs'].splice(Number(id),1);renderDetail();save();}
  else if(action==='sample-feed'){const form=$('#p2p-modal-form');form.elements.link.value='magnet:?xs=urn:btpk:8543d3e6115f0f98c944077a4493dcd543e49c739fd998550a1f614ab36ed63e&s=6e';form.elements.name.value='Sample photography';}
  else if(action==='sample-torrent'){const form=$('#p2p-modal-form');form.elements.name.value='Sample collection';form.elements.link.value='magnet:?xt=urn:btih:'+'ab'.repeat(20);}
  else if(action==='download'){const split=id.lastIndexOf(':'),p=post(id.slice(0,split)),v=Number(id.slice(split+1));enqueue(p,v);tell('Download added to Transfers');render();save();}
  else if(action==='go-tx'){state.view='transfers';state.selection=id;state.activeDraft=null;state.mobile='reader';render();save();}
  else if(action==='toggle-tx'){const t=state.transfers.find(t=>t.id===id);t.status=t.status==='paused'?(t.progress===1?'seeding':'downloading'):'paused';render();save();}
  else if(action==='version'){const split=id.lastIndexOf(':');state.versions[id.slice(0,split)]=Number(id.slice(split+1));renderDetail();icons();save();}
  else if(action==='open-publication'){state.view='news';selectThread(ancestor(post(id)).id);}
  else if(action==='load-parent'){const p=post(id);loadText(p,true);el.disabled=true;el.textContent='Loading…';}
  else if(action==='follow-known'){feed(id).followed=true;groupPosts(state.selection).forEach(p=>loadText(p));tell('Feed followed without automatic file downloads');render();save();}
  else if(action==='unfollow'){const f=feed(id);f.followed=false;f.auto=false;f.mirror=false;closeModal();navigate('news');tell('Feed unfollowed. Local content has been kept.');save();}
  else if(action==='retry'){
   const p=post(id);if(pending.has(id))return;pending.add(id);renderDetail();
   setTimeout(()=>{pending.delete(id);p.retries=(p.retries||0)+1;if(p.retries>=2){p.unavailable=false;p.loaded=true;state.transfers.filter(t=>t.post===id&&t.status==='waiting').forEach(t=>t.status='downloading');tell('A source is now available');}else tell('No sources yet. You can try again.');renderDetail();save();},650);
  }
  else if(action==='reference'){
   const parts=id.split(':'),source=post(parts[0]),ref=source.versions[Number(parts[1])].refs[Number(parts[2])];
   let target=post(ref.target);if(!target){target={id:ref.target,feed:null,parent:null,title:ref.title,stamp:++state.clock,loaded:true,read:true,returnTo:ancestor(source).id,versions:[version('Content linked from another post. Opening this reference does not download its files.',[file(`${ref.title}.mp4`,ref.mb)])]};state.posts.push(target);}
   target.returnTo=ancestor(source).id;state.view='news';selectThread(target.id);
  }
  else if(action==='return-thread')selectThread(id);
  else if(action==='mobile-list'){state.mobile='list';root.dataset.mobile='list';save();}
  else if(action==='mobile-nav'){state.mobile=state.mobile==='nav'?'list':'nav';root.dataset.mobile=state.mobile;save();}
  icons();
 });
 const timer=setInterval(()=>{
  if(!root.isConnected){clearInterval(timer);return;}
  let changed=false,completed=false;
  for(const t of state.transfers){if(t.status==='downloading'){t.progress=Math.min(1,t.progress+.13);changed=true;if(t.progress===1){t.status='seeding';completed=true;}}}
  if(!changed)return;
  for(const t of state.transfers){
   root.querySelectorAll('[data-tx-progress]').forEach(el=>{if(el.dataset.txProgress===t.id)el.innerHTML=txProgress(t);});
   root.querySelectorAll('[data-tx-amount]').forEach(el=>{if(el.dataset.txAmount===t.id)el.textContent=`${size(total(post(t.post),t.v)*t.progress)} of ${size(total(post(t.post),t.v))}`;});
   root.querySelectorAll('[data-tx-control]').forEach(el=>{if(el.dataset.txControl===t.id)el.innerHTML=txControls(t);});
   root.querySelectorAll('[data-download]').forEach(el=>{if(el.dataset.download===t.id)el.innerHTML=downloadWidget(post(t.post),t.v);});
  }
  if(completed){renderSidebar();if(state.view==='library')renderList();}
  footer();save();
 },650);
 readRoute();
 render();
 syncRoute(true);
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.dataset.density=design.density;}});tweak.addSelect(design,'density',{label:'Density',options:[{label:'Comfortable',value:'comfortable'},{label:'Compact',value:'compact'}]});}
})();
</script>
